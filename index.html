<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030B04">
  <title>SoaringHigh-5</title>
  <link rel="manifest" href="manifest.json?v=2.45">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <div class="brand"><img src="icons/icon-192.png" alt=""><span>SoaringHigh-5</span></div>
    <button id="settings" class="gear" type="button" aria-label="Settings">⚙</button>
  </header>
  <div id="date" class="date"></div>
  <nav class="tabs">
    <button id="tab-today" type="button" class="tab active"></button>
    <button id="tab-todo" type="button" class="tab"></button>
    <button id="tab-urgency" type="button" class="tab"></button>
    <button id="tab-done" type="button" class="tab"></button>
  </nav>
  <main>
    <div id="notice" class="notice" hidden><span id="notice-text"></span></div>
    <section id="view-today">
      <form id="today-form" class="row-form"></form>
      <ul id="slots" class="list"></ul>
    </section>
    <section id="view-todo" hidden>
      <form id="todo-form" class="row-form"></form>
      <ul id="todo-list" class="list"></ul>
    </section>
    <section id="view-done" hidden>
      <ul id="done-list" class="list"></ul>
      <p id="done-note" class="note"></p>
    </section>
    <section id="view-settings" class="settings" hidden></section>
    <p id="hint" class="hint"></p>
  </main>
  <footer>
    <div id="sync-status" class="status tappable"></div>
    <div id="version" class="version">SoaringHigh-5 PWA v2.30</div>
  </footer>
</body>
</html>
